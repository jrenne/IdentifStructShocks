bookdown::gitbook:
  code_folding: hide
  css: style.css
  config:
    toc:
      before: |
        <li><a href="./">Identification of Structural Shocks</a></li>
      after: |
        <li><a href="https://github.com/rstudio/bookdown" target="blank">Published with bookdown</a></li>
    edit: https://github.com/jrenne/IdentifStructShocks/edit/main/%s
    download: ["pdf"]
bookdown::pdf_book:
  includes:
    in_header: [preamble.tex, pdf-modern.tex]
  latex_engine: xelatex
  citation_package: natbib
  keep_tex: yes
bookdown::epub_book: default
bookdown::bs4_book: default
